<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Buscador NV - Vendedor YR (FINAL)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8e6cf 0%, #7fcdcd 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2dd4bf 0%, #06b6d4 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .vendor-badge {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1.2em;
        }

        .content {
            padding: 40px;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .input-group {
            flex: 1;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #2dd4bf;
            box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.1);
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2dd4bf 0%, #06b6d4 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .result-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-top: 20px;
            border-left: 5px solid #2dd4bf;
        }

        .result-container.error {
            background: #fff5f5;
            border-left-color: #ff6b6b;
        }

        .result-container.success {
            background: #f0fff4;
            border-left-color: #10b981;
        }

        .phase {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #e1e1e1;
        }

        .phase.completed {
            border-left-color: #10b981;
        }

        .phase.pending {
            border-left-color: #fbbf24;
        }

        .phase-header {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
        }

        .info-label {
            font-weight: bold;
            color: #495057;
            font-size: 0.9em;
        }

        .info-value {
            color: #212529;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2dd4bf;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .export-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e1e1e1;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .foto-gallery {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e1e1e1;
        }

        .foto-item {
            display: inline-block;
            margin: 5px;
            padding: 8px 12px;
            background: #e0f2fe;
            border-radius: 6px;
            border: 1px solid #0891b2;
            cursor: pointer;
        }

        .foto-item:hover {
            background: #bae6fd;
        }

        .btn-foto {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%);
            color: white;
        }

        .btn-foto:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .btn-foto:active {
            transform: translateY(0);
        }

        .foto-preview {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .foto-preview:hover {
            border-color: #0891b2;
            box-shadow: 0 4px 12px rgba(8, 145, 178, 0.2);
        }

        .status-connection {
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .status-success { background: #d1fae5; color: #065f46; }
        .status-warning { background: #fef3c7; color: #92400e; }
        .status-error { background: #fee2e2; color: #991b1b; }
        .status-info { background: #dbeafe; color: #1e40af; }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .content {
                padding: 20px;
            }

            .search-box {
                flex-direction: column;
            }

            .export-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Buscador de Notas de Venta</h1>
            <div class="vendor-badge">👤 Vendedor: YR</div>
            <div style="margin-top: 10px;">
                <small id="ultimaActualizacion" style="opacity: 0.8;">Inicializando...</small>
            </div>
        </div>

        <div class="content">
            <!-- Estado de conexión -->
            <div id="estadoConexionContainer" class="status-connection status-info">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                    <div>
                        <span id="estadoConexion">🔄 Conectando...</span>
                        <div style="font-size: 0.9em; margin-top: 3px;">
                            <span id="metodoConexion"></span>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <button class="btn btn-secondary" onclick="actualizarAhora()" id="btnActualizar" style="padding: 8px 16px; font-size: 14px;">
                            <span>🔄</span> Actualizar
                        </button>
                    </div>
                </div>
            </div>

            <div class="search-section">
                <h2>🔎 Buscar Nota de Venta</h2>
                <div class="search-box">
                    <div class="input-group">
                        <input type="text" id="numeroNV" placeholder="Ingresa el número de la Nota de Venta" />
                    </div>
                    <button class="btn btn-primary" onclick="buscarNotaVenta()">
                        <span>🔍</span> Buscar
                    </button>
                </div>

                <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                    <button class="btn btn-secondary" onclick="buscarTodasMisNV()">
                        <span>📋</span> Todas mis NV
                    </button>
                    <button class="btn btn-secondary" onclick="buscarPendientes()">
                        <span>⏳</span> Por Definir
                    </button>
                    <button class="btn btn-secondary" onclick="buscarCompletadas()">
                        <span>✅</span> Despacho Definido
                    </button>
                </div>

                <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 15px; background: #f8f9fa; border-radius: 8px; margin-bottom: 20px;">
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()" checked style="margin: 0;">
                        <span>🔁 Auto-actualizar cada 90 segundos</span>
                    </label>
                    
                    <div style="margin-left: auto; text-align: right; font-size: 0.9em;">
                        <div id="tiempoTranscurrido" style="color: #666;"></div>
                    </div>
                </div>
            </div>

            <div id="resultados"></div>
        </div>
    </div>

    <script>
        // Configuración del vendedor YR
        const VENDEDOR = 'YR';
        
        // URLs de conexión optimizadas
        const URLS_CONEXION = {
            json_directo: 'https://docs.google.com/spreadsheets/d/115hygvTHMNtF0KuQ3AcUgbhjA-WO1Nga3Kjra4wBZX0/gviz/tq?tqx=out:json&sheet=Registros&headers=1',
            csv_directo: 'https://docs.google.com/spreadsheets/d/115hygvTHMNtF0KuQ3AcUgbhjA-WO1Nga3Kjra4wBZX0/export?format=csv&gid=0',
            proxy_allorigins: 'https://api.allorigins.win/raw?url='
        };

        // Variables globales
        let datosCompletos = [];
        let encabezados = [];
        let ultimaActualizacion = null;
        let intervalRefresh = null;
        let datosOriginales = '';
        let metodoConexionActual = '';
        let timeoutConexion = 8000;
        let inicioConexion = null;

        // Cargar datos al inicio
        window.addEventListener('load', function() {
            inicializarSistema();
        });

        // Permitir buscar con Enter
        document.getElementById('numeroNV').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarNotaVenta();
            }
        });

        async function inicializarSistema() {
            actualizarEstadoConexion('🚀 Iniciando sistema...', 'info');
            document.getElementById('autoRefresh').checked = true;
            await cargarDatosOptimizado(true);
            toggleAutoRefresh();
            iniciarContadorTiempo();
        }

        // SISTEMA DE CARGA OPTIMIZADO
        async function cargarDatosOptimizado(mostrarNotif = true) {
            try {
                inicioConexion = Date.now();
                if (mostrarNotif) mostrarCargando();
                
                actualizarEstadoConexion('⚡ Conectando...', 'info');
                
                const promesasConexion = [
                    intentarJSONPRapido(),
                    intentarCSVDirecto(),
                    intentarConProxy()
                ];
                
                const resultado = await Promise.race(promesasConexion);
                
                if (resultado.exito) {
                    finalizarCargaDatos(resultado.metodo, mostrarNotif, resultado.hayNuevosDatos);
                } else {
                    throw new Error('Todos los métodos fallaron');
                }
                
            } catch (error) {
                console.error('❌ Error en carga optimizada:', error);
                actualizarEstadoConexion('❌ Sin conexión', 'error');
                
                if (mostrarNotif) {
                    mostrarError('No se pudieron cargar los datos.');
                }
            }
        }

        // MÉTODO JSONP OPTIMIZADO
        async function intentarJSONPRapido() {
            return new Promise((resolve, reject) => {
                const timeoutId = setTimeout(() => {
                    cleanup();
                    reject(new Error('Timeout JSONP'));
                }, timeoutConexion);
                
                const callbackName = 'gsc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                let script;
                
                const cleanup = () => {
                    clearTimeout(timeoutId);
                    if (script && script.parentNode) {
                        script.parentNode.removeChild(script);
                    }
                    if (window[callbackName]) {
                        delete window[callbackName];
                    }
                };
                
                window[callbackName] = function(response) {
                    try {
                        cleanup();
                        
                        if (response && response.table && response.table.rows) {
                            const cols = response.table.cols || [];
                            encabezados = cols.map(col => col.label || col.id || '');
                            
                            datosCompletos = response.table.rows.map(row => {
                                return row.c ? row.c.map(cell => {
                                    if (!cell) return '';
                                    return cell.f || cell.v || '';
                                }) : [];
                            });
                            
                            const tiempoConexion = Date.now() - inicioConexion;
                            console.log(`✅ JSONP exitoso en ${tiempoConexion}ms`);
                            
                            resolve({
                                exito: true,
                                metodo: `JSONP (${tiempoConexion}ms)`,
                                hayNuevosDatos: true
                            });
                        } else {
                            reject(new Error('Respuesta JSONP inválida'));
                        }
                    } catch (error) {
                        cleanup();
                        reject(error);
                    }
                };
                
                script = document.createElement('script');
                script.src = URLS_CONEXION.json_directo + '&tqx=out:json;responseHandler:' + callbackName;
                script.onerror = () => {
                    cleanup();
                    reject(new Error('Error script JSONP'));
                };
                
                document.head.appendChild(script);
            });
        }

        // MÉTODO CSV DIRECTO
        async function intentarCSVDirecto() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeoutConexion);
                
                const response = await fetch(URLS_CONEXION.csv_directo, {
                    signal: controller.signal,
                    cache: 'no-cache'
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const csvText = await response.text();
                const hayNuevosDatos = csvText !== datosOriginales;
                datosOriginales = csvText;
                
                procesarCSVOptimizado(csvText);
                
                const tiempoConexion = Date.now() - inicioConexion;
                console.log(`✅ CSV directo exitoso en ${tiempoConexion}ms`);
                
                return {
                    exito: true,
                    metodo: `CSV directo (${tiempoConexion}ms)`,
                    hayNuevosDatos
                };
                
            } catch (error) {
                console.log('❌ CSV directo falló:', error.message);
                throw error;
            }
        }

        // MÉTODO CON PROXY
        async function intentarConProxy() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeoutConexion);
                
                const url = URLS_CONEXION.proxy_allorigins + encodeURIComponent(URLS_CONEXION.csv_directo);
                const response = await fetch(url, {
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`Proxy error: ${response.status}`);
                }
                
                const csvText = await response.text();
                const hayNuevosDatos = csvText !== datosOriginales;
                datosOriginales = csvText;
                
                procesarCSVOptimizado(csvText);
                
                const tiempoConexion = Date.now() - inicioConexion;
                console.log(`✅ Proxy exitoso en ${tiempoConexion}ms`);
                
                return {
                    exito: true,
                    metodo: `Proxy (${tiempoConexion}ms)`,
                    hayNuevosDatos
                };
                
            } catch (error) {
                console.log('❌ Proxy falló:', error.message);
                throw error;
            }
        }

        // PROCESADOR CSV OPTIMIZADO
        function procesarCSVOptimizado(csvText) {
            const lineas = csvText.split(/\r?\n/);
            const datos = [];
            
            for (let i = 0; i < lineas.length; i++) {
                const linea = lineas[i].trim();
                if (linea) {
                    datos.push(parseCSVLinea(linea));
                }
            }
            
            if (datos.length > 0) {
                encabezados = datos[0];
                datosCompletos = datos.slice(1);
            }
        }

        function parseCSVLinea(linea) {
            const resultado = [];
            let actual = '';
            let dentroComillas = false;
            
            for (let i = 0; i < linea.length; i++) {
                const char = linea[i];
                const siguiente = linea[i + 1];
                
                if (char === '"') {
                    if (dentroComillas && siguiente === '"') {
                        actual += '"';
                        i++;
                    } else {
                        dentroComillas = !dentroComillas;
                    }
                } else if (char === ',' && !dentroComillas) {
                    resultado.push(actual.trim());
                    actual = '';
                } else {
                    actual += char;
                }
            }
            
            resultado.push(actual.trim());
            return resultado;
        }

        // DETECTAR FOTOS CON EXTRACCIÓN MEJORADA DE HIPERVÍNCULOS
        function detectarFotos(data) {
            const fotos = [];
            
            // Mapeo según las imágenes reales del Google Sheets
            const columnasFotos = [
                // CREACIÓN (G=6, H=7, I=8)
                { indice: 6, nombre: 'FNV 1', fase: 'creacion' },
                { indice: 7, nombre: 'Foto NV1', fase: 'creacion' },
                { indice: 8, nombre: 'Foto NV2', fase: 'creacion' },
                
                // PROCESO (S=18, T=19, U=20, V=21, W=22, X=23, Y=24, Z=25, AA=26, AB=27)
                { indice: 17, nombre: 'Doc', fase: 'proceso' },
                { indice: 18, nombre: 'F1', fase: 'proceso' },
                { indice: 19, nombre: 'F2', fase: 'proceso' },
                { indice: 20, nombre: 'F3', fase: 'proceso' },
                { indice: 21, nombre: 'F4', fase: 'proceso' },
                { indice: 22, nombre: 'F5', fase: 'proceso' },
                { indice: 23, nombre: 'F6', fase: 'proceso' },
                { indice: 24, nombre: 'F7', fase: 'proceso' },
                { indice: 25, nombre: 'F8', fase: 'proceso' },
                { indice: 26, nombre: 'F9', fase: 'proceso' },
                { indice: 27, nombre: 'F10', fase: 'proceso' },
                
                // ENTREGA (AE=30, AF=31, AG=32)
                { indice: 30, nombre: 'Foto Ent 1', fase: 'entrega' },
                { indice: 31, nombre: 'Foto Ent 2', fase: 'entrega' },
                { indice: 32, nombre: 'Foto Ent 3', fase: 'entrega' }
            ];
            
            columnasFotos.forEach(col => {
                const valor = data[col.indice];
                if (valor && valor.toString().trim() !== '' && 
                    valor.toString().trim() !== 'nan' && 
                    valor.toString().trim() !== 'undefined') {
                    
                    const valorLimpio = valor.toString().trim();
                    
                    // BUSCAR HIPERVÍNCULO COMPLETO (formato: =HIPERVINCULO("URL";"TEXTO"))
                    const urlExtraida = extraerURLCompleta(valorLimpio);
                    
                    if (urlExtraida) {
                        // Encontró un hipervínculo con URL
                        const textoVisible = extraerTextoHipervinculo(valorLimpio) || col.nombre;
                        
                        fotos.push({
                            nombre: col.nombre,
                            texto: textoVisible,
                            url: urlExtraida,
                            urlVisualizacion: convertirURLVisualizacion(urlExtraida),
                            urlThumbnail: convertirURLThumbnail(urlExtraida),
                            fase: col.fase,
                            tipo: 'drive',
                            mostrarURL: true
                        });
                    } else if (valorLimpio.length > 0) {
                        // Solo texto, mostrar como antes
                        fotos.push({
                            nombre: col.nombre,
                            texto: valorLimpio,
                            fase: col.fase,
                            tipo: 'texto',
                            mostrarURL: false
                        });
                    }
                }
            });
            
            return fotos;
        }

        // FUNCIÓN MEJORADA PARA EXTRAER URL COMPLETA
        function extraerURLCompleta(texto) {
            // Buscar hipervínculo en formato =HIPERVINCULO("URL";"TEXTO")
            const patronHipervinculo = /=HIPERVINCULO\s*\(\s*"([^"]+)"\s*;\s*"[^"]*"\s*\)/i;
            const match = patronHipervinculo.exec(texto);
            
            if (match) {
                return match[1]; // Devolver la URL extraída
            }
            
            // Si no es hipervínculo, buscar URL directa
            const patronURL = /https:\/\/drive\.google\.com\/file\/d\/[a-zA-Z0-9_-]+/;
            const matchURL = patronURL.exec(texto);
            
            if (matchURL) {
                return matchURL[0];
            }
            
            return null;
        }

        // FUNCIÓN PARA EXTRAER TEXTO DEL HIPERVÍNCULO
        function extraerTextoHipervinculo(texto) {
            const patronTexto = /=HIPERVINCULO\s*\(\s*"[^"]+"\s*;\s*"([^"]*)"\s*\)/i;
            const match = patronTexto.exec(texto);
            
            if (match) {
                return match[1]; // Devolver el texto visible
            }
            
            return null;
        }

        // CONVERTIR URL DE GOOGLE DRIVE PARA VISUALIZACIÓN DIRECTA
        function convertirURLVisualizacion(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match) {
                const fileId = match[1];
                return `https://drive.google.com/uc?id=${fileId}&export=view`;
            }
            return url;
        }

        // CONVERTIR URL DE GOOGLE DRIVE PARA THUMBNAIL
        function convertirURLThumbnail(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match) {
                const fileId = match[1];
                return `https://drive.google.com/thumbnail?id=${fileId}&sz=w300`;
            }
            return url;
        }

        // GENERAR LISTA SIMPLE DE HIPERVÍNCULOS TAL COMO ESTÁN EN SHEETS
        function generarGaleriaFotos(fotos) {
            if (fotos.length === 0) return '';
            
            let html = `
                <div class="foto-gallery">
                    <h4>📸 Fotos y Documentos (${fotos.length} disponibles)</h4>
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 15px;">
            `;
            
            fotos.forEach((foto, index) => {
                const icono = foto.fase === 'creacion' ? '📋' : 
                           foto.fase === 'proceso' ? '🔧' : '📦';
                
                if (foto.tipo === 'drive' && foto.url) {
                    // Mostrar hipervínculo completo tal como está en Sheets
                    const hipervinculoCompleto = `=HIPERVINCULO("${foto.url}"; "${foto.texto}")`;

        // FUNCIÓN PARA DESCARGAR FOTO
        function descargarFoto(url, nombre) {
            try {
                // Abrir en nueva pestaña para descarga
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.download = nombre || 'foto';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                mostrarNotificacion(`📷 Abriendo ${nombre} para descarga`);
            } catch (error) {
                console.error('Error al descargar foto:', error);
                // Fallback: abrir en nueva pestaña
                window.open(url, '_blank');
                mostrarNotificacion(`📷 Abriendo ${nombre} en nueva pestaña`);

                return;

            const resultado = buscarNVenDatos(numeroNV);
            
            if (resultado.encontrada) {
                const vendedorNV = resultado.data[3] ? resultado.data[3].toString().toUpperCase() : '';
                const vendedorProceso = resultado.data[12] ? resultado.data[12].toString().toUpperCase() : '';
                
                if (vendedorNV === VENDEDOR || vendedorProceso === VENDEDOR) {
                    mostrarResultadoMejorado(resultado);
                } else {
                    mostrarError(`La Nota de Venta ${numeroNV} no pertenece al vendedor ${VENDEDOR}.`);

        function buscarNVenDatos(numeroNV) {
            for (let i = 0; i < datosCompletos.length; i++) {
                if (datosCompletos[i][1] && datosCompletos[i][1].toString() === numeroNV) {
                    return {
                        encontrada: true,
                        data: datosCompletos[i],
                        fila: i + 1
                    };
                }
            }
            return { encontrada: false };
        }

        // FUNCIÓN PARA FORMATEAR FECHA Y HORA
        function formatearFechaHora(fechaStr) {
            if (!fechaStr || fechaStr.toString().trim() === '') {
                return 'No especificada';
            }
            
            const fecha = fechaStr.toString().trim();
            
            if (fecha.includes(':')) {
                try {
                    const fechaObj = new Date(fecha);
                    if (!isNaN(fechaObj.getTime())) {
                        return `📅 ${fechaObj.toLocaleDateString('es-CL')} ⏰ ${fechaObj.toLocaleTimeString('es-CL')}`;
                    }
                } catch (e) {
                    // Si falla, devolver tal como está
                }
                return `📅 ${fecha}`;
            } else {
                return `📅 ${fecha}`;
            }
        }

<script>
// Read photo URLs from LOG's existing service; CSV exports discard HYPERLINK targets.
const LOG_PHOTO_SERVICE = 'https://script.google.com/macros/s/AKfycbykJ9tPaGxg6436X5D1ZZWfiZhghXwRdB8DfoiO39fuHn9gIs2N6CDLVvGBcS01ZXFS/exec';
const logPhotoStyle = document.createElement('style');
logPhotoStyle.textContent = `.log-gallery{margin:24px 0;text-align:left}.log-photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.log-photo-card{border:1px solid #dbe3ec;border-radius:12px;padding:12px;background:#fff;min-width:0}.log-photo-card img{width:100%;height:160px;object-fit:contain;background:#f3f5f8;border-radius:8px}.log-photo-card button,.log-gallery button,.log-photo-dialog button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;background:#1459a6;color:white;margin:6px 6px 6px 0}.log-photo-card a,.log-photo-dialog a{display:inline-block;margin:8px 0;color:#1459a6}.log-photo-card p{overflow-wrap:anywhere}.log-photo-dialog{width:min(1000px,95vw);max-width:95vw;padding:16px;border:0;border-radius:12px}.log-photo-dialog::backdrop{background:#102030ba}.log-photo-dialog iframe{display:block;width:100%;height:70vh;border:0}.log-photo-dialog img{display:block;max-width:100%;max-height:70vh;margin:auto;object-fit:contain}.log-photo-message{padding:14px;background:#f3f5f8;border-radius:10px}.log-photo-top{display:flex;align-items:center;justify-content:space-between;gap:12px}`;
document.head.append(logPhotoStyle);

function logElement(tag, text, className) {
    const element = document.createElement(tag);
    if (text !== undefined) element.textContent = text;
    if (className) element.className = className;
    return element;
}

function logSafeUrl(value) {
    try {
        const url = new URL(value);
        return url.protocol === 'https:' ? url : null;
    } catch { return null; }
}

function logDriveId(url) {
    if (!['drive.google.com', 'docs.google.com'].includes(url.hostname)) return null;
    const id = url.pathname.match(/\/d\/([\w-]+)/)?.[1] || url.searchParams.get('id');
    return id && /^[\w-]+$/.test(id) ? id : null;
}

function logOriginalLink(url) {
    const link = logElement('a', 'Abrir archivo original ↗');
    link.href = url.href;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    return link;
}

function logOpenPhoto(label, url, id, opener) {
    const dialog = logElement('dialog', undefined, 'log-photo-dialog');
    const top = logElement('div', undefined, 'log-photo-top');
    top.append(logElement('strong', label));
    const close = logElement('button', 'Cerrar');
    close.type = 'button';
    close.onclick = () => dialog.close();
    top.append(close);
    dialog.append(top, logOriginalLink(url));
    if (id) {
        const frame = document.createElement('iframe');
        frame.src = `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`;
        frame.title = label;
        frame.allowFullscreen = true;
        dialog.append(frame);
    } else {
        const image = document.createElement('img');
        image.src = url.href;
        image.alt = label;
        image.onerror = () => { image.replaceWith(logElement('p', 'Vista previa no disponible. Abre el archivo original.')); };
        dialog.append(image);
    }
    dialog.append(logElement('p', 'Si Drive solicita acceso, abre el archivo original con tu cuenta autorizada.'));
    dialog.addEventListener('close', () => { dialog.remove(); opener?.focus(); });
    dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
    document.body.append(dialog);
    dialog.showModal();
    close.focus();
}

function logRenderPhotos(host, records) {
    host.replaceChildren();
    let count = 0;
    for (const record of records) {
        const photos = Object.entries(record.fotos || {}).filter(([, photo]) => logSafeUrl(typeof photo === 'string' ? photo : photo?.url));
        if (!photos.length) continue;
        const section = logElement('section');
        section.append(logElement('h4', `NV ${record.numeroNV || ''} · ${record.vendedor || 'Sin vendedor'} · ${photos.length} archivos`));
        const grid = logElement('div', undefined, 'log-photo-grid');
        for (const [name, photo] of photos) {
            const url = logSafeUrl(typeof photo === 'string' ? photo : photo.url);
            const id = logDriveId(url);
            const label = photo.texto && photo.texto !== name ? `${name} · ${photo.texto}` : name;
            const card = logElement('article', undefined, 'log-photo-card');
            card.append(logElement('strong', label));
            const image = document.createElement('img');
            image.alt = label;
            image.loading = 'lazy';
            image.src = id ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w600` : url.href;
            image.onerror = () => image.replaceWith(logElement('p', 'Vista previa no disponible. Puedes abrir el archivo original.'));
            const open = logElement('button', 'Ampliar');
            open.type = 'button';
            open.onclick = () => logOpenPhoto(label, url, id, open);
            card.append(image, open, logOriginalLink(url));
            grid.append(card);
            count++;
        }
        section.append(grid);
        host.append(section);
    }
    if (!count) host.append(logElement('p', 'No hay fotos ni documentos disponibles en la respuesta de LOG para esta NV.', 'log-photo-message'));
}

const logPhotoCache = new Map();
const logPhotoRequests = new Map();
async function logFetchPhotos(nv) {
    const key = String(nv).trim().toUpperCase();
    const cached = logPhotoCache.get(key);
    if (cached && Date.now() - cached.time < 60000) return cached.result;
    if (logPhotoRequests.has(key)) return logPhotoRequests.get(key);
    const request = (async () => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 25000);
        try {
            const response = await fetch(`${LOG_PHOTO_SERVICE}?nv=${encodeURIComponent(nv)}`, {signal:controller.signal,redirect:'follow'});
            if (!response.ok) throw new Error('No se pudo consultar LOG.');
            const result = await response.json();
            if (!result.success) throw new Error(result.error || 'LOG no devolvió los archivos de esta NV.');
            if (!Array.isArray(result.datos)) throw new Error('La respuesta de LOG no contiene una lista de archivos válida.');
            logPhotoCache.set(key, {time:Date.now(),result});
            if (logPhotoCache.size > 30) logPhotoCache.delete(logPhotoCache.keys().next().value);
            return result;
        } finally { clearTimeout(timeout); }
    })().finally(() => logPhotoRequests.delete(key));
    logPhotoRequests.set(key, request);
    return request;
}

async function logLoadPhotos(host, nv, vendor) {
    host.replaceChildren(logElement('p', 'Cargando fotos y documentos de LOG…', 'log-photo-message'));
    try {
        const result = await logFetchPhotos(nv);
        if (!host.isConnected) return;
        const records = result.datos.filter(record => String(record.numeroNV).trim().toUpperCase() === String(nv).trim().toUpperCase() && (!vendor || String(record.vendedor || '').trim().toUpperCase() === vendor));
        logRenderPhotos(host, records);
    } catch (error) {
        if (!host.isConnected) return;
        host.replaceChildren(logElement('p', error.name === 'AbortError' ? 'LOG tardó demasiado en responder. Vuelve a intentar.' : `No se pudieron cargar las fotos: ${error.message}`, 'log-photo-message'));
        const retry = logElement('button', 'Reintentar fotos');
        retry.type = 'button';
        retry.onclick = () => logLoadPhotos(host, nv, vendor);
        host.append(retry);
    }
}

function logMountGallery(nv, vendor) {
    const result = document.querySelector('#resultados .result-container');
    if (!result) return;
    const section = logElement('section', undefined, 'log-gallery');
    section.append(logElement('h3', '📸 Fotos y documentos de LOG'));
    const host = logElement('div');
    host.setAttribute('aria-live', 'polite');
    section.append(host);
    const exportSection = result.querySelector('.export-section');
    result.insertBefore(section, exportSection);
    logLoadPhotos(host, nv, vendor);
}

<script>
// Bounded, vendor-scoped Google Sheets queries; no third-party proxies or demo data.
const logFastColumns = 'A,B,C,D,E,F,J,K,L,M,N,O,P,Q,AC,AD,AH,AI,AJ,AK,AL,AM,AN,AO';
const logFastPending = new Map();
let logFastSequence = 0;
let logFastView = 0;
let logFastHasAll = false;
const logFastCacheKey = `log-nv-v3-${VENDEDOR}`;
const logFastVendorWhere = `(upper(D) = '${VENDEDOR}' or upper(M) = '${VENDEDOR}')`;

function logFastOwn(row) {
    return [row[3], row[12]].some(value => String(value || '').trim().toUpperCase() === VENDEDOR);
}
function logFastIndex(column) {
    return [...column].reduce((n, c) => n * 26 + c.charCodeAt(0) - 64, 0) - 1;
}
function logFastRows(table) {
    return (table.rows || []).map(record => {
        const row = Array(42).fill('');
        table.cols.forEach((column, index) => {
            const cell = record.c?.[index];
            row[logFastIndex(column.id)] = cell?.f ?? cell?.v ?? '';
        });
        return row;
    }).filter(logFastOwn);
}
function logFastQuery(where, limit = '') {
    const query = `select ${logFastColumns} where ${where}${limit ? ' limit ' + limit : ''}`;
    if (logFastPending.has(query)) return logFastPending.get(query);
    const promise = new Promise((resolve, reject) => {
        const callback = `logFast_${Date.now()}_${++logFastSequence}`;
        const script = document.createElement('script');
        const cleanup = () => {
            clearTimeout(timer);
            script.remove();
            // A late Google response must not revive an expired query.
            window[callback] = () => {};
            setTimeout(() => delete window[callback], 60000);
        };
        const timer = setTimeout(() => { cleanup(); reject(new Error('LOG no respondió en 10 segundos. Puedes reintentar.')); }, 10000);
        window[callback] = response => {
            cleanup();
            if (response.status !== 'ok' || !response.table) {
                reject(new Error('No se pudo consultar la planilla de LOG.')); return;
            }
            try { resolve(logFastRows(response.table)); } catch (error) { reject(error); }
        };
        script.onerror = () => { cleanup(); reject(new Error('No se pudo conectar con Google Sheets.')); };
        script.src = 'https://docs.google.com/spreadsheets/d/115hygvTHMNtF0KuQ3AcUgbhjA-WO1Nga3Kjra4wBZX0/gviz/tq?sheet=Registros&headers=1&tq=' + encodeURIComponent(query) + '&tqx=' + encodeURIComponent('out:json;responseHandler:' + callback);
        document.head.append(script);
    }).finally(() => logFastPending.delete(query));
    logFastPending.set(query, promise);
    return promise;
}
function logFastSave() {
    try { localStorage.setItem(logFastCacheKey, JSON.stringify({time: Date.now(), rows: datosCompletos.slice(0, 150)})); } catch {}
}
function logFastRestore() {
    try {
        const cached = JSON.parse(localStorage.getItem(logFastCacheKey));
        if (!cached || !Number.isFinite(cached.time) || !Array.isArray(cached.rows) || Date.now() - cached.time > 86400000) return false;
        datosCompletos = cached.rows.filter(row => Array.isArray(row) && logFastOwn(row));
        if (!datosCompletos.length) return false;
        ultimaActualizacion = new Date(cached.time);
        actualizarUltimaActualizacion();
        actualizarEstadoConexion('Datos guardados · actualizando…', 'info');
        return true;
    } catch { return false; }
}
function logFastError(message) {
    const host = document.getElementById('resultados');
    host.replaceChildren(logElement('p', message, 'log-photo-message'));
    const retry = logElement('button', 'Reintentar conexión');
    retry.className = 'btn btn-primary';
    retry.onclick = () => logFastLoad(true);
    host.append(retry);
}
async function logFastLoad(show = true) {
    const view = logFastView;
    actualizarEstadoConexion(datosCompletos.length ? 'Actualizando…' : 'Cargando NV recientes…', 'info');
    if (!datosCompletos.length && show) document.getElementById('resultados').textContent = 'Puedes ingresar una NV mientras se cargan los registros recientes.';
    try {
        const rows = await logFastQuery(logFastVendorWhere, 150);
        const recent = new Set(rows.map(row => String(row[1] || row[10])));
        datosCompletos = [...rows, ...datosCompletos.filter(row => !recent.has(String(row[1] || row[10])))];
        ultimaActualizacion = new Date();
        actualizarUltimaActualizacion();
        actualizarEstadoConexion(`✅ Listo · ${rows.length} NV recientes`, 'success');
        logFastSave();
        if (show && view === logFastView) document.getElementById('resultados').textContent = 'Busca una NV o consulta tus pedidos. Las fotos se cargan al abrir el detalle.';
    } catch (error) {
        actualizarEstadoConexion(datosCompletos.length ? 'Sin conexión · datos guardados' : 'Sin conexión', 'error');
        if (!datosCompletos.length && show && view === logFastView) logFastError(error.message);

}

if (typeof cargarDatos === 'function') cargarDatos = logFastLoad;
if (typeof cargarDatosOptimizado === 'function') cargarDatosOptimizado = logFastLoad;

buscarNVenDatos = function(nv) {
    const key = String(nv).trim().toUpperCase();
    const index = datosCompletos.findIndex(row => logFastOwn(row) && [row[1], row[10]].some(value => String(value || '').trim().toUpperCase() === key));

const logFastRenderDetail = typeof mostrarResultadoMejorado === 'function' ? mostrarResultadoMejorado : mostrarResultado;
buscarNotaVenta = async function() {

    if (!nv) { logFastError('Ingresa un número de NV.'); return; }
    const view = ++logFastView;
    const found = buscarNVenDatos(nv);
    if (found.encontrada) { logFastRenderDetail(found); return; }
    document.getElementById('resultados').textContent = `Buscando NV ${nv}…`;
    try {
        // The two NV columns are numeric in the current Sheets query schema.
        if (!/^\d+$/.test(nv) || nv.length > 15) {

                const rows = await logFastQuery(logFastVendorWhere);
                datosCompletos = rows;
                logFastHasAll = true;

toggleAutoRefresh = function() {
